<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>TermGrid Demo</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="demo.css" />
</head>
<body>
<div id="stage">
  <div id="win">
    <div id="titlebar">
      <img src="assets/icon.png" alt="" /><span>TermGrid</span><div class="grow"></div>
      <div class="wc"><span class="min"><i></i></span><span class="max"><i></i></span><span class="cls"><i></i></span></div>
    </div>
    <div id="winbody"></div>
  </div>
  <div id="outro">
    <img src="assets/icon.png" alt="TermGrid" />
    <div class="t" id="outro-t"></div>
    <div class="u" id="outro-u">github.com/JoseDaniloS/TermGrid</div>
  </div>
  <div id="caps"></div>
  <div id="kbd"></div>
  <div id="ripple"></div>
  <div id="cursor">
    <svg class="arrow" width="14" height="22" viewBox="0 0 14 22"><path d="M1 1 V17.5 L5.2 13.6 L8 20 L10.6 18.8 L7.8 12.6 H13 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <svg class="rs ew" width="22" height="18" viewBox="0 0 22 18"><path d="M3 9 H19 M6 5 L2 9 L6 13 M16 5 L20 9 L16 13" fill="none" stroke="#111" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9 H19 M6 5 L2 9 L6 13 M16 5 L20 9 L16 13" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="rs ns" width="22" height="18" viewBox="0 0 22 18"><path d="M3 9 H19 M6 5 L2 9 L6 13 M16 5 L20 9 L16 13" fill="none" stroke="#111" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9 H19 M6 5 L2 9 L6 13 M16 5 L20 9 L16 13" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="demo.js"></script>
</body>
</html>
